version: 2.1

jobs:
  backend:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - run: pip install uv==0.12.10
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
      - run: uv sync --frozen
      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - .venv
      - run: mkdir -p test-results && uv run --frozen pytest -q --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  frontend:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run lint
      - run: mkdir -p test-results && npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - store_test_results:
          path: test-results
      - run: npm run build

  docker:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke.sh
      - run:
          name: API logs on failure
          command: docker compose logs backend
          when: on_fail

workflows:
  ci:
    jobs:
      - backend
      - frontend
      - docker:
          requires:
            - backend
            - frontend
